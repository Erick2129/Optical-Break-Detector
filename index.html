<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de fallas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="tarjeta">
        <h2>Detector de fallas - FO</h2>
        
        <div class="grupo-input">
            <label for="cliente">ID del Cliente</label>
            <input type="text" id="cliente" name="cliente" placeholder="Ej: COCOCEN..." value="">
        </div>
        
        <div class="grupo-input">
            <label for="distancia">Distancia OTDR (Metros)</label>
            <input type="number" id="distancia" name="distancia" placeholder="Ej: 1500" value="0">
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" id="invertir" name="invertir">
            <label for="invertir">Invertir dibujo del tramo (Desde el cliente)</label>
        </div>

        <button type="button" onclick="lanzarCalculo()">Extraer KML</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
